---
- name: Set platform/version specific variables
  include_tasks: tasks/set_vars.yml

- name: Validate role parameters
  include_tasks: tasks/assert_role_vars.yml

- name: Warn if journald_sync_interval is set in volatile mode
  debug:
    msg: >-
      WARNING - journald_sync_interval should not be set when
      journald_persistent: false
  when:
    - journald_sync_interval | int != 0
    - not journald_persistent

- name: Ensure required packages are installed
  package:
    name: "{{ __journald_packages }}"
    state: present
    use: "{{ (__journald_is_ostree | d(false)) |
              ternary('ansible.posix.rhel_rpm_ostree', omit) }}"
  register: __journald_package_result

# A staged install reports ok on re-runs, so ask rpm (by provides) if it is live.
- name: Check whether the packages are live on a transactional update system
  command:  # noqa command-instead-of-module
    argv: "{{ ['rpm', '-q', '--whatprovides'] + __journald_packages }}"
  register: __journald_packages_live
  changed_when: false
  failed_when: false
  check_mode: false
  when: __journald_is_transactional | d(false)

- name: Handle reboot for transactional update systems
  when:
    - __journald_is_transactional | d(false)
    - __journald_package_result is changed or
      (__journald_packages_live.rc | d(0)) != 0
  block:
    - name: Notify user that reboot is needed to apply changes
      debug:
        msg: >
          Reboot required to apply changes due to transactional updates.

    - name: Reboot transactional update systems
      reboot:
        msg: Rebooting the system to apply transactional update changes.
      when:
        - journald_transactional_update_reboot_ok is not none
        - journald_transactional_update_reboot_ok | bool

    - name: Fail if reboot is needed and not set
      fail:
        msg: >
          Reboot is required but not allowed. Please set 'journald_transactional_update_reboot_ok' to proceed.
      when:
        - journald_transactional_update_reboot_ok is none

- name: Ensure required services are enabled
  service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ __journald_services }}"

- name: Create journald configuration drop-in directory
  file:
    path: "{{ __journald_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure persistent journal
  include_tasks: tasks/persistent.yml
  when: journald_persistent | bool

- name: Configure volatile journal
  include_tasks: tasks/volatile.yml
  when: not (journald_persistent | bool)

- name: Deploy journald configuration drop-in
  template:
    src: journald.conf.j2
    dest: "{{ __journald_dropin_dir }}/{{ __journald_dropin_conf }}"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart journald services

- name: Record role success fingerprint
  sr_fingerprint:
    status: success
    role_name: journald
    role_path: "{{ role_path }}"
    ansible_play_hosts_all: "{{ ansible_play_hosts_all }}"
    distribution: "{{ ansible_facts['distribution'] }}"
    distribution_version: "{{ ansible_facts['distribution_version'] }}"
    write_log_file: "{{ __journald_write_log_file }}"
