---
# journald.conf(5) disk size, file count, and time span settings do not
# accept negative values. meta/argument_specs.yml already ensures these
# variables are integers; the checks below ensure they are non-negative.
- name: Assert journald_max_disk_size is a non-negative integer
  ansible.builtin.assert:
    that:
      - journald_max_disk_size | int >= 0
    fail_msg: >-
      journald_max_disk_size must be a non-negative integer,
      got {{ journald_max_disk_size }}

- name: Assert journald_max_files is a non-negative integer
  ansible.builtin.assert:
    that:
      - journald_max_files | int >= 0
    fail_msg: >-
      journald_max_files must be a non-negative integer,
      got {{ journald_max_files }}

- name: Assert journald_max_file_size is a non-negative integer
