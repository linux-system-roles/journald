---
- name: Ensure that the role runs with default parameters
  hosts: all
  tasks:
    - name: See if /dev/log exists for the fingerprint check
      ansible.builtin.stat:
        path: /dev/log
      register: __register_dev_log

    - name: Set the start time for the journal search
      ansible.builtin.set_fact:
        __journal_start_time: "{{ ansible_facts['date_time']['date'] ~ ' ' ~ ansible_facts['date_time']['time'] }}"
      when: __register_dev_log.stat.exists

    - name: Run the role
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        __journald_write_log_file: true

    - name: Get fingerprint entries from journal
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -eo pipefail;
          journalctl --since "{{ __journal_start_time }}" --no-pager |
          grep -v " Invoked with" |
          grep "sr_fingerprint.*role_name=journald"
      register: __register_journal_fingerprints
      changed_when: false
      when: __register_dev_log.stat.exists

    - name: Check that the log file was written
      ansible.builtin.slurp:
        path: /var/log/sysroles.jsonl
      register: __register_log_file

    - name: Verify log file and journal fingerprints
      when: __register_dev_log.stat.exists
      vars:
        __journal_lines: "{{ __register_journal_fingerprints.stdout_lines }}"
        __journal_begin: "{{ __journal_lines | select('search', 'status=begin') | list }}"
        __journal_success: "{{ __journal_lines | select('search', 'status=success') | list }}"
        __begin_date: "{{ (__journal_begin[0] | regex_search('date=([^ ]+)', '\\1'))[0] }}"
        __success_date: "{{ (__journal_success[0] | regex_search('date=([^ ]+)', '\\1'))[0] }}"
        __file_content: "{{ __register_log_file.content | b64decode }}"
      block:
        - name: Print contents of logs
          debug:
            var: item
          loop:
            - "{{ __file_content }}"
            - "{{ __journal_lines }}"

        - name: Assert content is correct
          ansible.builtin.assert:
            that:
              - __journal_begin | length > 0
              - __journal_success | length > 0
              - __begin_date in __file_content
              - __success_date in __file_content

    # Make sure services are restarted before we verify system state is correct
    - name: Flush handlers
      meta: flush_handlers

    - name: Get systemd-journald service state
      command:
        # noqa command-instead-of-module
        cmd: systemctl show --property SubState systemd-journald.service
      register: systemctl
      changed_when: false

    - name: Verify that systemd-journald is running
      assert:
        that: systemctl.stdout == 'SubState=running'

    - name: Verify that /run/log/journal/$MACHINE_ID/system.journal exists
      stat:
        path: /run/log/journal/{{ ansible_facts['machine_id'] }}/system.journal
      register: __stat
      failed_when: not __stat.stat.exists

    - name: Verify that system.journal is in online state
      shell:
        cmd: >
          set -euo pipefail;
          journalctl --header
          --file /run/log/journal/{{ ansible_facts['machine_id'] }}/system.journal |
          grep -q 'State: ONLINE'
      changed_when: false

    - name: Verify that system.journal is compressed
      shell:
        cmd: >
          set -euo pipefail;
          journalctl --header
          --file /run/log/journal/{{ ansible_facts['machine_id'] }}/system.journal |
          grep -q COMPRESSED
      changed_when: false
